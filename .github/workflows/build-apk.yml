name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "personal-ai-assistant.zip"
      - "personal-ai-assistant (1).zip"
      - "personal-ai-assistant_4-compressed.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Extract Android project
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q "personal-ai-assistant_4-compressed.zip" -d build-src
          cd build-src
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
      - name: Apply approved Personal AI Assistant logo
        working-directory: build-src
        run: |
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/personal_ai_logo.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0B1F3A" android:pathData="M54,4 L101,31 L101,77 L54,104 L7,77 L7,31 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M54,20 L82,36 L82,65 L69,73 L54,82 L39,73 L26,65 L26,36 Z"/>
              <path android:fillColor="#0B1F3A" android:pathData="M36,42 L47,36 L47,49 L36,55 Z M61,36 L72,42 L72,55 L61,49 Z"/>
              <path android:fillColor="#0B1F3A" android:pathData="M43,61 L54,54 L65,61 L54,68 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M51,28 L54,18 L57,28 Z"/>
              <path android:fillColor="#0B1F3A" android:pathData="M30,57 L20,52 L20,47 L30,52 Z M78,57 L88,52 L88,47 L78,52 Z"/>
          </vector>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("app/src/main/AndroidManifest.xml")
          if not p.exists(): raise SystemExit("AndroidManifest.xml not found")
          s=p.read_text()
          s=re.sub(r'android:icon="[^"]*"', 'android:icon="@drawable/personal_ai_logo"', s, count=1)
          s=re.sub(r'android:roundIcon="[^"]*"', 'android:roundIcon="@drawable/personal_ai_logo"', s, count=1)
          if 'android:icon=' not in s: s=s.replace('<application','<application android:icon="@drawable/personal_ai_logo"',1)
          if 'android:roundIcon=' not in s: s=s.replace('<application','<application android:roundIcon="@drawable/personal_ai_logo"',1)
          p.write_text(s)
          PY
      - name: Prepare debug keystore
        working-directory: build-src
        run: keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -alias androiddebugkey
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Build debug APK
        working-directory: build-src
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          test -f build-src/app/build/outputs/apk/debug/app-debug.apk
          ls -lh build-src/app/build/outputs/apk/debug/app-debug.apk
          sha256sum build-src/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: personal-ai-assistant-debug-apk
          path: build-src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload APK directly to existing Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-fixed
          files: build-src/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          fail_on_unmatched_files: true