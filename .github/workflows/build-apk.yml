name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "personal-ai-assistant.zip"
      - "personal-ai-assistant (1).zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -x "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Android project
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q "personal-ai-assistant (1).zip" -d build-src
          cd build-src
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Prepare debug keystore
        working-directory: build-src
        run: |
          keytool -genkeypair -v             -keystore debug.keystore             -storepass android             -keypass android             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Android Debug,O=Android,C=US"             -alias androiddebugkey

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        working-directory: build-src
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -f build-src/app/build/outputs/apk/debug/app-debug.apk
          ls -lh build-src/app/build/outputs/apk/debug/app-debug.apk
          sha256sum build-src/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-ai-assistant-debug-apk
          path: build-src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload APK directly to existing Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-fixed
          files: build-src/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          fail_on_unmatched_files: true
